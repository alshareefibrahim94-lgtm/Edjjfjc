name: Take website offline

# One-off: replaces the published site with an empty placeholder page.
on:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: |
          mkdir site
          echo '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Offline</title>' > site/index.html
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
