name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk saudi-news.apk
      - uses: actions/upload-artifact@v4
        with:
          name: saudi-news-apk
          path: saudi-news.apk
      # One fixed download link that always holds the newest build.
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --target "$GITHUB_SHA" \
            --title "أخبار السعودية — تطبيق أندرويد" --notes "Latest build of the Android app. Download saudi-news.apk and open it on the phone to install."
          gh release upload app saudi-news.apk --clobber
